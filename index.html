<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Integritetspolicyer för Laroäventyren-apparna Matteäventyret och Ordäventyret.">
  <title>Integritetspolicyer – Läroäventyren</title>
  <style>
    :root { color-scheme: light; --ink: #25352f; --muted: #52645b; --green: #397557; --paper: #fbfaf6; --line: #e1e5dc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(720px, 100%); padding: clamp(28px, 7vw, 64px); background: #fff; border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 18px 50px #25352f0b; }
    .eyebrow { color: var(--green); font-size: .82rem; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin: 6px 0 10px; font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.15; letter-spacing: -.04em; }
    p { color: var(--muted); }
    nav { display: grid; gap: 14px; margin-top: 28px; }
    a.card { display: flex; justify-content: space-between; align-items: center; padding: 20px 22px; border: 1px solid var(--line); border-radius: 16px; color: var(--ink); text-decoration: none; transition: border-color .15s, transform .15s; }
    a.card:hover, a.card:focus-visible { border-color: var(--green); transform: translateY(-2px); }
    .name { font-size: 1.15rem; font-weight: 700; }
    .hint { display: block; color: var(--muted); font-size: .93rem; font-weight: 400; }
    .arrow { color: var(--green); font-size: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Laroäventyren</div>
    <h1>Integritetspolicyer</h1>
    <p>Välj app för att läsa dess integritetspolicy. Select an app to read its privacy policy.</p>
    <nav aria-label="Välj app">
      <a class="card" href="matteaventyret/">
        <span><span class="name">Matteäventyret</span><span class="hint">Integritetspolicy · Privacy Policy</span></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="card" href="ordaventyret/">
        <span><span class="name">Ordäventyret</span><span class="hint">Integritetspolicy · Privacy Policy</span></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>
</body>
</html>
